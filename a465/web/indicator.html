<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A465 indicator</title>
<style>
:root{--bg:#05080c;--panel:#0e141b;--line:#2a3643;--fg:#f2f6fa;--dim:#8a98a8;--ok:#43e08a;--warn:#ffb020;--bad:#ff4b4b;--acc:#35c4ff;
--num:ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"DejaVu Sans",Arial,sans-serif;overflow-x:hidden}
body{padding:12px;font-size:clamp(14px,1.6vw,20px)}
#top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 16px;display:flex;align-items:baseline;gap:10px}
.chip small{color:var(--dim);font-size:.7em;text-transform:uppercase;letter-spacing:.08em}
#frame{font-size:clamp(28px,5vw,64px);font-weight:800;letter-spacing:.06em;color:#000;background:var(--acc);border-color:var(--acc)}
#frame.world{background:#b58cff;border-color:#b58cff}#frame.tool{background:#ffb020;border-color:#ffb020}
#frame.none{background:var(--panel);color:var(--dim);border-color:var(--line)}
.big{font:700 clamp(28px,5vw,64px)/1 var(--num)}
#cap{color:var(--warn)}
.bad{color:var(--bad);border-color:var(--bad)}.warn{color:var(--warn);border-color:var(--warn)}.ok{color:var(--ok)}
.banner{font-weight:700;font-size:clamp(18px,3vw,36px);padding:12px 16px;border-radius:10px;margin-bottom:10px;color:#fff;background:#c01818}
.banner.amber{background:var(--warn);color:#000}
#stale{display:none;font:800 clamp(22px,4vw,48px)/1.1 system-ui;color:#000;background:var(--warn);padding:10px 16px;border-radius:10px;margin-bottom:10px;text-align:center}
#main{display:grid;grid-template-columns:3fr 2fr;gap:14px}
@media (max-width:820px){#main{grid-template-columns:1fr}}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{margin:0 0 8px;font-size:.8em;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.jrow{border:2px solid transparent;border-radius:10px;padding:4px 8px;margin-bottom:4px}
.jrow.cmd{border-color:var(--acc);background:#0b2230}
.jline{display:flex;align-items:baseline;gap:10px}
.jname{font:700 clamp(20px,3vw,34px)/1 var(--num);width:2.2em}
.jang{font:700 clamp(28px,4.4vw,56px)/1 var(--num);width:7.4ch;text-align:right;white-space:pre}
.jang i,.unit{font-style:normal;font-size:.45em;color:var(--dim)}
.jspd{font:600 clamp(18px,2.6vw,32px)/1 var(--num);color:var(--acc);margin-left:auto;white-space:pre;text-align:right}
.dir{font:800 clamp(24px,4vw,48px)/1 var(--num);width:1.1em;text-align:center;color:var(--acc)}
.bar{position:relative;height:16px;background:#1a232d;border-radius:8px;margin-top:6px}
.bar .t{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--dim)}
.bar .t.z{background:var(--fg);width:3px}
.bar .m{position:absolute;top:-5px;width:10px;height:26px;margin-left:-5px;background:var(--fg);border-radius:3px}
.bar .m.near{background:var(--warn)}
.jrow.glim .bar{background:#4a3306}
.bar .m.out{background:var(--bad)}
.trow{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.trow:last-of-type{border:0}
.tl{width:2.6em;color:var(--dim);font:700 clamp(18px,2.6vw,30px) var(--num)}
.tv{font:700 clamp(28px,4.2vw,56px)/1 var(--num);margin-left:auto;white-space:pre;text-align:right}
.tu{width:3.4em;color:var(--dim);font-size:.9em}
.note{color:var(--dim);font-size:.7em;margin-top:8px}
@media (max-width:520px){body{padding:8px}.jline{gap:4px}.jname{font-size:18px}.dir{font-size:22px;width:.8em}.jspd{font-size:15px}.jang{font-size:30px}.tv{font-size:32px}.tl{font-size:17px}.chip{padding:4px 10px}}
#err{display:none;position:sticky;top:0;z-index:5}
#poses{display:none;margin-top:14px}
#poses h2{display:flex;align-items:center;gap:12px}
button{font:inherit;color:var(--fg);background:#17212b;border:2px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px}
button:disabled{opacity:.35}
#save{font-weight:700;color:#000;background:var(--acc);border-color:var(--acc);margin-left:auto}
.pose{border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.pose.sel{border-color:var(--acc);background:#0b2230}
.pose.here{border-color:var(--ok)}
.pinfo{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pname{font:700 clamp(22px,3vw,34px)/1.1 var(--num)}
.pname b{color:var(--acc);font-size:.6em;margin-right:6px}
.pxyz{font:600 clamp(16px,2vw,26px) var(--num);color:var(--fg);white-space:pre}
.pdiff{font:700 clamp(16px,2vw,26px) var(--num);margin-left:auto;white-space:pre}
.pdiff.zero{color:var(--ok)}
.more{flex:0 0 auto}.pact{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.hold{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-weight:800;min-height:56px;flex:1 1 100px;border-color:var(--ok);background:#0f2a1c}
.hold small{display:block;font-weight:600;font-size:.65em;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.hold.on{background:var(--ok);color:#000}.hold.on small{color:#000}
.pbar{flex:1 1 100%;height:12px;background:#1a232d;border-radius:6px;overflow:hidden;display:none}
.pbar i{display:block;height:100%;background:var(--acc);width:0}
.pbar.arr i{background:var(--ok)}
.pst{flex:1 1 100%;font-weight:700;color:var(--ok);display:none}
.sm{min-height:44px;padding:6px 12px}
.pmenu{display:none;flex:1 1 100%;gap:8px;flex-wrap:wrap;align-items:center}
.pmenu input{font:inherit;color:var(--fg);background:#05080c;border:2px solid var(--line);border-radius:8px;padding:8px;min-width:0;flex:1 1 120px}
.del{border-color:var(--bad);color:var(--bad)}
.nopose{color:var(--dim);padding:8px}
#nums{transition:opacity .15s}#nums.dim{opacity:.25}
</style></head><body>
<div id="top">
 <div class="chip" id="frame" title="frame">---</div>
 <div class="chip"><small>speed</small><span class="big" id="spd">--%</span><span class="big" id="cap"></span></div>
 <div class="chip" id="pad"><small>pad</small><span id="padt">--</span></div>
 <div class="chip warn" id="jogd" style="display:none"></div>
</div>
<div id="ctl" class="banner" style="display:none"></div>
<div id="nt" class="banner amber" style="display:none"></div>
<div id="stale"></div>
<div id="err" class="banner"></div>
<div id="nums"><div id="main">
 <div class="card"><h2>Joints</h2><div id="joints"></div></div>
 <div class="card"><h2>Tool point</h2>
  <div id="tcp"></div>
  <div class="note">from the PC's model of the arm</div></div>
</div>
<div class="card" id="poses"><h2>Saved poses <button id="save" type="button">Save current pose</button></h2>
 <div id="plist"></div>
 <div class="note">Go / Go straight move the arm only while you hold the button down.</div></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const J=$("joints"),rows=[];
for(let i=0;i<6;i++){const r=document.createElement("div");r.className="jrow";
 r.innerHTML=`<div class="jline"><span class="jname">J${i+1}</span><span class="dir"></span><span class="jang">--</span><span class="jspd">--</span></div><div class="bar"><div class="m"></div></div>`;
 J.appendChild(r);rows.push({r,dir:r.querySelector(".dir"),a:r.querySelector(".jang"),s:r.querySelector(".jspd"),bar:r.querySelector(".bar"),m:r.querySelector(".m"),lim:null});}
const T=$("tcp"),tl=[["X","x","mm"],["Y","y","mm"],["Z","z","mm"],["Yaw","yaw","°"],["Pitch","pitch","°"],["Roll","roll","°"],["Speed","_s","mm/s"]],tv={};
for(const [n,k,u] of tl){const d=document.createElement("div");d.className="trow";d.innerHTML=`<span class="tl">${n}</span><span class="tv">--</span><span class="tu">${u}</span>`;T.appendChild(d);tv[k]=d.querySelector(".tv");}
const num=(v,d,w)=>(typeof v==="number"&&isFinite(v))?v.toFixed(d).padStart(w," "):"--".padStart(w," ");
const lastOk={t:0};
function setLimits(row,lim){ if(!lim||row.lim===lim.join())return; row.lim=lim.join();
 row.bar.querySelectorAll(".t").forEach(e=>e.remove());
 const [lo,hi]=lim;for(const v of [lo,0,hi]){if(v<lo||v>hi)continue;const t=document.createElement("div");t.className="t"+(v===0?" z":"");t.style.left=((v-lo)/(hi-lo)*100)+"%";row.bar.appendChild(t);}}
function render(s){
 const fr=s.frame;const f=$("frame");f.textContent=fr?String(fr).toUpperCase():"---";f.className="chip "+(fr||"none");
 const sp=s.speed;$("spd").textContent=(typeof sp==="number"?Math.round(sp):"--")+"%";
 let eff=null;const c=s.command;
 if(c&&typeof c.speed==="number"&&typeof sp==="number"&&c.speed<sp)eff=c.speed;
 $("cap").textContent=eff!==null?"→ "+Math.round(eff)+"%":"";
 const p=s.pad||{};const pe=$("pad");
 $("padt").textContent=p.connected?("connected"+(p.l1?" · L1 HELD":" · L1 off")):"NOT CONNECTED";
 pe.className="chip "+(p.connected?(p.l1?"ok":""):"bad");
 const jg=$("jogd");const jd=s.jogd;
 if(jd&&jd!=="running"){jg.style.display="";jg.textContent="jog: "+jd;jg.className="chip "+(jd==="dead"?"bad":"warn");}else jg.style.display="none";
 const cm=s.controller_message;$("ctl").style.display=cm?"":"none";if(cm)$("ctl").textContent=cm.text||String(cm);
 $("nt").style.display=s.notice?"":"none";$("nt").textContent=s.notice||"";
 const js=s.joints||[],sps=s.joint_speeds||[],lims=s.limits||[];
 rows.forEach((w,i)=>{
  const a=js[i],lim=lims[i];setLimits(w,lim);
  w.a.innerHTML=num(a,2,7)+"<i>°</i>";
  w.s.textContent=num(sps[i],1,7)+" °/s";
  const lm=s.limit,gnear=!!(lm&&lm.joint===i+1);
  w.r.classList.toggle("glim",gnear);
  const on=c&&c.axis===i+1;w.r.classList.toggle("cmd",!!on);
  w.dir.textContent=on?(c.sign>0?"+":"−"):"";
  if(lim&&typeof a==="number"){const fr=(a-lim[0])/(lim[1]-lim[0]);w.m.style.left=Math.max(0,Math.min(1,fr))*100+"%";
   w.m.className="m"+(fr<0||fr>1?" out":(gnear||fr<.05||fr>.95?" near":""));w.m.style.display="";}else w.m.style.display="none";
 });
 const t=s.tcp;
 for(const [n,k] of tl){ if(k==="_s")tv[k].textContent=num(s.tcp_speed,1,8); else tv[k].textContent=num(t&&t[k],1,8);}
}
function stale(s,now){
 if(!s)return "no connection";
 if(typeof s.position_time!=="number"||typeof s.now!=="number")return "no fresh position";
 return (s.now-s.position_time>1.5)?"no fresh position":"";
}
let cur=null,lastAnswer=0,errMsg="";
const PAGE_VERSION="__PAGE_VERSION__";   /* filled in by the server; a newer page on the server makes this one reload */
async function poll(){
 try{const r=await fetch("/state",{cache:"no-store"});const s=await r.json();
  lastAnswer=performance.now();
  if(s.page_version&&PAGE_VERSION.indexOf("__")!==0&&s.page_version!==PAGE_VERSION&&!hold){location.reload();return;}
  if(s.error){errMsg="server: "+s.error;}else{errMsg="";cur=s;render(s);updatePoses(s);}
 }catch(e){}
 setTimeout(poll,200);
}
function tick(){
 let m="";
 if(performance.now()-lastAnswer>1000)m="no connection";
 else if(errMsg)m=errMsg;
 else m=stale(cur);
 const st=$("stale");st.style.display=m?"":"none";st.textContent=m;
 $("nums").classList.toggle("dim",!!m);if(P.on){const was=P.staleNow;updatePoses(cur);if(m&&!was&&hold)endHold("stale");}
}

/* ---- saved poses ---- */
const P={on:false,poses:[],selected:null,rows:new Map(),open:null,confirm:null,start:null,staleNow:true};
let errTimer=0;
function showErr(m){const e=$("err");e.textContent=String(m);e.style.display="block";clearTimeout(errTimer);errTimer=setTimeout(()=>{e.style.display="none"},6000);}
async function api(method,url,body){
 const r=await fetch(url,{method,cache:"no-store",headers:body===undefined?{}:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
 let d=null;try{d=await r.json();}catch(e){}
 if(!r.ok){const err=new Error((d&&d.error)||("HTTP "+r.status));err.http=r.status;throw err;}
 return d;
}
async function act(url,body){try{const d=await api("POST",url,body);await loadPoses();return d;}catch(e){showErr(e.message);try{await loadPoses();}catch(_){}}}
function diffTo(p,s){const j=s&&s.joints;if(!j||j.length!==6||!p.joints)return null;let m=0;for(let i=0;i<6;i++)m=Math.max(m,Math.abs(j[i]-p.joints[i]));return m;}
async function loadPoses(){
 let d;try{d=await api("GET","/poses");}catch(e){if(e.http===404){P.on=false;$("poses").style.display="none";}return;}
 P.on=true;P.poses=d.poses||[];P.selected=d.selected;$("poses").style.display="block";syncRows();
}
function mkBtn(txt,cls,fn){const b=document.createElement("button");b.type="button";b.className=cls||"sm";b.textContent=txt;b.addEventListener("click",fn);return b;}
function makeRow(name){
 const el=document.createElement("div");el.className="pose";
 el.innerHTML=`<div class="pinfo"><span class="pname"></span><span class="pxyz"></span><span class="pdiff"></span></div>
 <div class="pact"><button type="button" class="hold" data-st="0">Go<small>Hold to go</small></button><button type="button" class="hold" data-st="1">Go straight<small>Hold to go</small></button><button type="button" class="sm more" aria-label="more">⋯</button>
 <div class="pbar"><i></i></div><div class="pst"></div>
 <div class="pmenu"></div></div>`;
 const w={name,el,nm:el.querySelector(".pname"),xyz:el.querySelector(".pxyz"),df:el.querySelector(".pdiff"),bar:el.querySelector(".pbar"),fill:el.querySelector(".pbar i"),st:el.querySelector(".pst"),menu:el.querySelector(".pmenu"),holds:[...el.querySelectorAll(".hold")],menuKey:""};
 el.querySelector(".pinfo").addEventListener("click",()=>{act("/poses/select",{name:w.name});});
 el.querySelector(".more").addEventListener("click",()=>{P.open=P.open===w.name?null:w.name;P.confirm=null;renderMenu(w);});
 w.holds.forEach(b=>wireHold(b,w));
 return w;
}
function renderMenu(w){
 const open=P.open===w.name,key=open?(P.confirm===w.name?"c":"m"):"";
 w.menu.style.display=open?"flex":"none";
 if(w.menuKey===key)return;w.menuKey=key;w.menu.textContent="";
 if(!open)return;
 if(P.confirm===w.name){
  const t=document.createElement("span");t.textContent="Delete "+w.name+"?";t.style.fontWeight="700";w.menu.appendChild(t);
  const y=mkBtn("Yes, delete","sm del",()=>{P.confirm=null;P.open=null;act("/poses/delete",{name:w.name});});
  w.menu.appendChild(y);w.menu.appendChild(mkBtn("Cancel","sm",()=>{P.confirm=null;renderMenu(w);}));
 }else{
  const inp=document.createElement("input");inp.value=w.name;inp.maxLength=40;inp.setAttribute("aria-label","new name");
  w.menu.appendChild(inp);
  w.menu.appendChild(mkBtn("Rename","sm",()=>{const n=inp.value.trim();if(!n||n===w.name)return;P.open=null;act("/poses/rename",{old:w.name,new:n});}));
  w.menu.appendChild(mkBtn("Delete","sm del",()=>{P.confirm=w.name;renderMenu(w);}));
 }
}
function syncRows(){
 const L=$("plist"),seen=new Set();
 for(const p of P.poses){seen.add(p.name);let w=P.rows.get(p.name);if(!w){w=makeRow(p.name);P.rows.set(p.name,w);}
  w.p=p;}
 /* Put the rows in list order ONLY when the order on the page is wrong, and never during a hold: moving a row in
    the document, even to the place it already has, makes the browser drop the pointer capture of a held button
    ("lostpointercapture"), which ended every page go-to within a second (seen on the arm 2026-11-26). */
 const want=P.poses.map(p=>P.rows.get(p.name).el),have=[...L.children].filter(e=>e.classList.contains("pose"));
 if(!hold&&!(want.length===have.length&&want.every((el,k)=>el===have[k]))){for(const el of want)L.appendChild(el);}
 for(const [n,w] of [...P.rows]){if(!seen.has(n)){if(hold&&hold.w===w)endHold("pose removed");w.el.remove();P.rows.delete(n);}}
 if(!P.poses.length&&!L.querySelector(".nopose")){const d=document.createElement("div");d.className="nopose";d.textContent="No saved poses yet. Move the arm, then Save current pose.";L.appendChild(d);}
 else if(P.poses.length){const e=L.querySelector(".nopose");if(e)e.remove();}
 updatePoses(cur);
}
function updatePoses(s){
 if(!P.on)return;
 const stl=stale(s)!==""||performance.now()-lastAnswer>1000;P.staleNow=stl;
 $("save").disabled=stl;
 const g=s&&s.goto,sel=(s&&s.selected!==undefined)?s.selected:P.selected;
 if(g&&g.running||g&&g.arrived){if(!P.start||P.start.name!==g.name)P.start={name:g.name,max:0};P.start.max=Math.max(P.start.max,g.remaining_deg||0);}
 else if(!g)P.start=null;
 for(const w of P.rows.values()){
  const p=w.p;if(!p)continue;
  w.nm.innerHTML=(p.name===sel?"<b>●</b>":"")+"";w.nm.appendChild(document.createTextNode(p.name));
  w.xyz.textContent=`X ${num(p.x,0,0)}  Y ${num(p.y,0,0)}  Z ${num(p.z,0,0)} mm`;
  const d=diffTo(p,s);w.df.textContent=d===null?"Δ --":(d<0.05?"HERE 0.0°":"Δ "+num(d,1,0)+"°");w.df.className="pdiff"+(d!==null&&d<0.05?" zero":"");
  w.el.classList.toggle("sel",p.name===sel);w.el.classList.toggle("here",d!==null&&d<0.05);
  const mine=g&&g.name===p.name;
  w.holds.forEach(b=>{b.disabled=stl;});
  if(mine&&(g.running||g.arrived)){
   w.bar.style.display="block";w.st.style.display=g.arrived?"block":"none";w.st.textContent=g.arrived?"Arrived":"";
   const mx=P.start&&P.start.name===g.name?P.start.max:0;
   const f=g.arrived?1:(mx>0.01?Math.max(0,Math.min(1,1-(g.remaining_deg||0)/mx)):0);
   w.fill.style.width=(f*100)+"%";w.bar.classList.toggle("arr",!!g.arrived);
  }else{w.bar.style.display="none";w.st.style.display="none";}
  renderMenu(w);
 }
}
/* ---- hold-to-run: repeats exist only while hold!==null, and hold is set only between pointerdown and any end event ---- */
let hold=null,inflight=null;
function sendGoto(){
 const h=hold;if(!h)return;
 if(inflight)return;
 const p=api("POST","/goto",{name:h.w.name,straight:h.straight}).then(()=>{},e=>{if(hold===h){showErr(e.message);endHold("failed");}});
 inflight=p.finally(()=>{inflight=null;});
}
function endHold(why){
 const h=hold;if(!h)return;hold=null;
 if(why!=="pointerup")showErr("go-to stopped: "+why);      /* say why, unless the button was simply let go */
 clearInterval(h.timer);h.btn.classList.remove("on");
 try{h.btn.releasePointerCapture(h.id);}catch(e){}
 const done=inflight?Promise.race([inflight,new Promise(r=>setTimeout(r,500))]):Promise.resolve();
 done.then(()=>api("POST","/stop",{why:String(why)})).catch(e=>showErr("stop: "+e.message));
}
function wireHold(btn,w){
 const straight=btn.dataset.st==="1";
 btn.addEventListener("pointerdown",e=>{
  if(e.button!==0&&e.pointerType==="mouse")return;
  e.preventDefault();if(hold||btn.disabled||P.staleNow)return;
  try{btn.setPointerCapture(e.pointerId);}catch(_){}
  hold={btn,w,straight,id:e.pointerId,timer:0,x0:e.clientX,y0:e.clientY};btn.classList.add("on");
  sendGoto();
  hold.timer=setInterval(()=>{
   if(!hold||hold.btn!==btn){clearInterval(hold&&hold.timer);return;}
   if(document.hidden){endHold("page hidden");return;}
   if(P.staleNow||btn.disabled){endHold("no fresh position");return;}
   sendGoto();},100);
 });
 const up=e=>{if(hold&&hold.btn===btn&&(e.pointerId===undefined||e.pointerId===hold.id))endHold(e.type);};
 btn.addEventListener("pointerup",up);btn.addEventListener("pointercancel",up);
 btn.addEventListener("lostpointercapture",up);   /* not pointerleave: the page can shift under a finger that has not moved */
 /* The hold follows the finger, not the button: the layout may shift when a move starts. It ends when the
    pointer itself has travelled more than 60 px from where it went down. */
 btn.addEventListener("pointermove",e=>{if(hold&&hold.btn===btn&&e.pointerId===hold.id){
  if(Math.hypot(e.clientX-hold.x0,e.clientY-hold.y0)>60)endHold("finger moved away");}});
 for(const t of ["contextmenu","selectstart","dragstart"])btn.addEventListener(t,e=>e.preventDefault());
}
addEventListener("blur",()=>endHold("blur"));addEventListener("pagehide",()=>endHold("pagehide"));
document.addEventListener("visibilitychange",()=>{if(document.hidden)endHold("hidden");});
$("save").addEventListener("click",()=>{act("/poses",{});});
loadPoses();setInterval(loadPoses,1000);
setInterval(tick,200);poll();
</script></body></html>
